<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}OMRChecker Web UI{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css?v={{ STATIC_VERSION }}" />
</head>
<body>
    <header class="topbar">
        <div class="wrap">
            <a class="brand" href="/">OMRChecker</a>
            <nav class="links">
                <a href="/">Batches</a>
                <a href="/prefill">Prefill Sheets</a>
                <a href="/generate-csv">Generate Test CSV</a>
                <a href="/settings">Settings</a>
                <a href="/docs" target="_blank" rel="noopener">API docs</a>
            </nav>
        </div>
    </header>
    <main class="wrap main">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">
        <div class="wrap">
            <span>OMRChecker Web UI &middot; Local-first</span>
        </div>
    </footer>

    <!-- Log panel drawer ─────────────────────────────────────────── -->
    <div id="log-panel" class="collapsed" role="complementary" aria-label="Application logs">
        <div class="log-panel-header" id="log-panel-header">
            <span class="log-panel-title">Logs</span>
            <span class="log-panel-badge" id="log-badge">0</span>
            <div class="log-panel-actions" onclick="event.stopPropagation()">
                <button class="log-panel-btn" id="log-autoscroll-btn" title="Auto-scroll" aria-pressed="true">⏬ auto</button>
                <button class="log-panel-btn" id="log-clear-btn" title="Clear log">✕ clear</button>
            </div>
            <span class="log-panel-chevron" aria-hidden="true">▲</span>
        </div>
        <pre id="log-output" aria-live="polite" aria-label="Log output"></pre>
    </div>
    <!-- ────────────────────────────────────────────────────────────── -->

    <script src="/static/app.js?v={{ STATIC_VERSION }}" defer></script>
    {% block scripts %}{% endblock %}
</body>
</html>
