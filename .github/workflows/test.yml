name: Test

on:
  push:
    branches: [master]
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
  pull_request:
    branches: [master]
    # paths:
    #   - "src/**/*.py"
    #   - "tests/**/*.py"

jobs:
  test-and-coverage:
    name: "Test and Coverage"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }} with uv
        uses: ./.github/actions/setup-python-with-uv
        with:
          python-version: ${{ matrix.python-version }}

      - name: Creating .github-pytest and coverage folders
        run: mkdir -p ./.github-pytest/coverage

      - name: Run pytest
        run: |
          set -o pipefail
          uv run pytest --cov=src --cov-report=term --cov-fail-under=70 --junitxml=./.github-pytest/pytest-output.xml | tee .github-pytest/pytest-coverage.txt
        env:
          OMR_CHECKER_CONTAINER: true
          # Snapshot outputs embed the hour from localtime(); the committed
          # snapshots (e.g. Results_05AM.csv) were generated in Asia/Kolkata.
          TZ: Asia/Kolkata

      # Fork PRs get a read-only GITHUB_TOKEN under the pull_request event,
      # so commenting would fail with "Resource not accessible by integration".
      - name: Pytest coverage comment
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: MishaKav/pytest-coverage-comment@v1
        with:
          pytest-coverage-path: ./.github-pytest/pytest-coverage.txt
          junitxml-path: ./.github-pytest/pytest-output.xml

      # tj-actions/coverage-badge-py runs `pip install -U setuptools`, and
      # setuptools >= 81 no longer ships pkg_resources that coverage-badge
      # imports - install a compatible pair into the project venv instead.
      - name: Coverage Badge
        run: |
          uv pip install --python .venv "setuptools<81" coverage-badge
          uv run coverage-badge -f -o .github-pytest/coverage/coverage.svg

      # Only publish the badge from master - PRs must not overwrite it.
      - name: Publish coverage report to coverage-badge branch
        if: github.event_name == 'push'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: coverage-badge
          folder: .github-pytest/coverage
