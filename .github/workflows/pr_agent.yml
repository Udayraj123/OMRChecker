name: Qodo Merge PR Agent

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    name: Run Qodo Merge Agent
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - name: Qodo Merge Action
        uses: qodo-ai/pr-agent@f3b385ea2927247ddcff2fe252472380b9c8f5fc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config_model: "gemini/gemini-1.5-flash"
          config_fallback_models: '["gemini/gemini-1.5-flash"]'
          google_ai_studio_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_action_config_auto_review: "true"
          github_action_config_auto_describe: "true"
          github_action_config_auto_improve: "true"